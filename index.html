    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchVal = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return fetchVal; },
            set: function(val) { fetchVal = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fetch getter patch failure ignore
        }
      })();
    </script>
